name: Verify agent token expiry

on:
  push:
    branches:
      - validation/agent-token-expiry-127

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use supported npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.10.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm test
